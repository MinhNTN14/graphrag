name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.11.10

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # Neo4j integration tests auto-skip when NEO4J_URI is unset, so the
        # suite runs fully offline with no external services.
        run: pytest -q
